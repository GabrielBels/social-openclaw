<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<style>
.t-title{font-family:Geist;font-weight:700} .t-semi{font-family:Geist;font-weight:600}
.t-body{font-family:'Inter 18pt';font-weight:400} .t-bodyb{font-family:'Inter 18pt';font-weight:600}
.f-ivory{fill:#F6F3EC} .f-navy{fill:#12324A} .f-graphite{fill:#1E2732} .f-green{fill:#0F9D7A} .f-copper{fill:#B8743C} .f-white{fill:#FFFFFF} .f-none{fill:none}
.s-navy{stroke:#12324A} .s-graphite{stroke:#1E2732} .s-green{stroke:#0F9D7A} .s-copper{stroke:#B8743C} .s-white{stroke:#FFFFFF} .s-ivory{stroke:#F6F3EC}
</style>
  <rect width="1080" height="1080" class="f-navy"/>
  <!-- The renderer draws the logo in x 96 to 356, y 64 to 168: keep that corner empty. -->
  <text x="984" y="126" font-size="26" text-anchor="end" class="t-bodyb f-white" opacity=".7">5/5</text>

  <text x="96" y="380" font-size="72" class="t-title f-white">Four checks,</text>
  <text x="96" y="464" font-size="72" class="t-title f-white">one error-free month</text>
  <text x="96" y="560" font-size="36" class="t-body f-white" opacity=".85">Contract, amount, attachment and date:</text>
  <text x="96" y="608" font-size="36" class="t-body f-white" opacity=".85">check before every submission.</text>

  <rect x="96" y="760" width="888" height="120" rx="60" class="f-green"/>
  <text x="540" y="833" font-size="34" text-anchor="middle" class="t-bodyb f-white">Learn more at the link in bio.</text>
</svg>
