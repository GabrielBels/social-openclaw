<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<style>
.t-title{font-family:Geist;font-weight:700} .t-semi{font-family:Geist;font-weight:600}
.t-body{font-family:'Inter 18pt';font-weight:400} .t-bodyb{font-family:'Inter 18pt';font-weight:600}
.f-marfim{fill:#F6F3EC} .f-azul{fill:#12324A} .f-grafite{fill:#1E2732} .f-verde{fill:#0F9D7A} .f-cobre{fill:#B8743C} .f-white{fill:#FFFFFF} .f-none{fill:none}
.s-azul{stroke:#12324A} .s-grafite{stroke:#1E2732} .s-verde{stroke:#0F9D7A} .s-cobre{stroke:#B8743C} .s-white{stroke:#FFFFFF} .s-marfim{stroke:#F6F3EC}
</style>
  <rect width="1080" height="1080" class="f-marfim"/>
  <!-- The renderer draws the logo in x 96 to 356, y 64 to 168: keep that corner empty. -->
  <text x="984" y="126" font-size="26" text-anchor="end" class="t-bodyb f-grafite" opacity=".6">4/5</text>

  <text x="96" y="318" font-size="60" class="t-title f-azul">Recusa ou pagamento parcial?</text>

  <rect x="96" y="400" width="432" height="540" rx="28" class="f-white"/>
  <rect x="96" y="400" width="432" height="96" rx="28" class="f-cobre"/>
  <rect x="96" y="460" width="432" height="36" class="f-cobre"/>
  <text x="136" y="462" font-size="38" class="t-semi f-white">Recusa</text>
  <text x="136" y="576" font-size="32" class="t-body f-grafite">O cliente recusou</text>
  <text x="136" y="620" font-size="32" class="t-body f-grafite">o item e disse o motivo</text>
  <text x="136" y="664" font-size="32" class="t-body f-grafite">por escrito.</text>
  <text x="136" y="884" font-size="30" class="t-bodyb f-cobre">Cabe contestação</text>

  <rect x="552" y="400" width="432" height="540" rx="28" class="f-white"/>
  <rect x="552" y="400" width="432" height="96" rx="28" class="f-verde"/>
  <rect x="552" y="460" width="432" height="36" class="f-verde"/>
  <text x="592" y="462" font-size="38" class="t-semi f-white">Pagamento parcial</text>
  <text x="592" y="576" font-size="32" class="t-body f-grafite">O valor pago ficou</text>
  <text x="592" y="620" font-size="32" class="t-body f-grafite">abaixo do contrato, sem</text>
  <text x="592" y="664" font-size="32" class="t-body f-grafite">um motivo informado.</text>
  <text x="592" y="884" font-size="30" class="t-bodyb f-verde">Confira o contrato</text>
</svg>
