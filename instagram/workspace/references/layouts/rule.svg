<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<style>
.t-title{font-family:Geist;font-weight:700} .t-semi{font-family:Geist;font-weight:600}
.t-body{font-family:'Inter 18pt';font-weight:400} .t-bodyb{font-family:'Inter 18pt';font-weight:600}
.f-ivory{fill:#F6F3EC} .f-navy{fill:#12324A} .f-graphite{fill:#1E2732} .f-green{fill:#0F9D7A} .f-copper{fill:#B8743C} .f-white{fill:#FFFFFF} .f-none{fill:none}
.s-navy{stroke:#12324A} .s-graphite{stroke:#1E2732} .s-green{stroke:#0F9D7A} .s-copper{stroke:#B8743C} .s-white{stroke:#FFFFFF} .s-ivory{stroke:#F6F3EC}
</style>
  <rect width="1080" height="1080" class="f-ivory"/>
  <!-- The renderer draws the logo in x 96 to 356, y 64 to 168: keep that corner empty. -->
  <text x="984" y="126" font-size="26" text-anchor="end" class="t-bodyb f-graphite" opacity=".6">2/5</text>

  <rect x="96" y="250" width="150" height="48" rx="24" class="f-green"/>
  <text x="171" y="283" font-size="24" letter-spacing="2" text-anchor="middle" class="t-bodyb f-white">RULE</text>
  <text x="96" y="396" font-size="68" class="t-title f-navy">Check the record</text>
  <text x="96" y="474" font-size="68" class="t-title f-navy">on the order date</text>

  <rect x="96" y="580" width="888" height="300" rx="28" class="f-white"/>
  <rect x="136" y="624" width="8" height="212" rx="4" class="f-copper"/>
  <text x="176" y="660" font-size="34" class="t-bodyb f-copper">Risk</text>
  <text x="176" y="724" font-size="34" class="t-body f-graphite">An old record does not guarantee</text>
  <text x="176" y="774" font-size="34" class="t-body f-graphite">approval: the order may bounce if</text>
  <text x="176" y="824" font-size="34" class="t-body f-graphite">the contract had expired that day.</text>

  <text x="96" y="968" font-size="28" class="t-body f-graphite" opacity=".7">Illustrative example</text>
</svg>
